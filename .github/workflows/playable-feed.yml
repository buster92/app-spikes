name: Playable Feed

on:
  pull_request:
    paths:
      - "playable-feed/**"
      - ".github/workflows/playable-feed.yml"
  push:
    branches: [main]
    paths:
      - "playable-feed/**"
      - ".github/workflows/playable-feed.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playable-feed
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: npm run check

      - name: Tests
        run: npm test
