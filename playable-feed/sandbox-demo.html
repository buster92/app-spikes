<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090a12">
  <title>Playloop GameSpec sandbox demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #090a12; color: white; font-family: system-ui, sans-serif; }
    main { width: min(100%, 420px); padding: 18px; }
    h1 { margin: 0 0 6px; font-size: 24px; }
    p { color: #aeb7d4; font-size: 13px; line-height: 1.45; }
    canvas { width: 100%; aspect-ratio: 360 / 560; border: 1px solid rgba(255,255,255,.1); border-radius: 22px; touch-action: none; background: #0c1020; }
    button { width: 100%; min-height: 46px; margin-top: 12px; border: 0; border-radius: 14px; font-weight: 800; background: #fff; color: #111; }
    pre { white-space: pre-wrap; color: #93a0c5; font-size: 11px; }
  </style>
</head>
<body>
  <main>
    <h1>GameSpec v0</h1>
    <p>This page is intentionally separate from the feed. The game below is loaded from declarative JSON and executed by the sandbox runtime—no game-specific JavaScript.</p>
    <canvas id="sandboxCanvas" aria-label="GameSpec sandbox"></canvas>
    <button id="restartSandbox" type="button">Restart generated game</button>
    <pre id="sandboxOutput"></pre>
  </main>
  <script type="module" src="./src/sandbox/demo.js"></script>
</body>
</html>
