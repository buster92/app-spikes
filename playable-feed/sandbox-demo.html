<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090a12">
  <title>Playloop GameSpec sandbox demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #090a12; color: white; font-family: system-ui, sans-serif; }
    main { width: min(100%, 420px); padding: 18px; }
    h1 { margin: 0 0 6px; font-size: 24px; }
    p { color: #aeb7d4; font-size: 13px; line-height: 1.45; }
    .controls { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin: 12px 0; }
    select, button { min-height: 46px; border: 0; border-radius: 14px; font-weight: 800; }
    select { width: 100%; padding: 0 12px; background: #171a29; color: white; border: 1px solid rgba(255,255,255,.1); }
    button { padding: 0 16px; background: #fff; color: #111; }
    canvas { width: 100%; aspect-ratio: 360 / 560; border: 1px solid rgba(255,255,255,.1); border-radius: 22px; touch-action: none; background: #0c1020; }
    pre { min-height: 42px; white-space: pre-wrap; color: #93a0c5; font-size: 11px; line-height: 1.4; }
    .badge { display: inline-block; margin-top: 4px; padding: 4px 8px; border-radius: 999px; background: #171a29; color: #c9d2f3; font-size: 11px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>GameSpec v0</h1>
    <p>Each game below is declarative JSON executed by the same sandbox runtime. Sprite examples use verified content-addressed art; Star Catch and Whack Orb demonstrate additional mechanics without game-specific JavaScript.</p>
    <span class="badge">JSON rules · trusted assets · no game JavaScript</span>
    <div class="controls">
      <select id="sandboxGame" aria-label="Choose GameSpec example">
        <option value="meteor-dodge">Meteor Dodge · primitive drag</option>
        <option value="tap-bloom">Tap Bloom · primitive tap</option>
        <option value="space-dodge">Space Dodge · sprite assets</option>
        <option value="creator-star-catch">Star Catch · AI-authored catch game</option>
        <option value="whack-orb">Whack Orb · zero-asset moving target</option>
      </select>
      <button id="restartSandbox" type="button">Restart</button>
    </div>
    <canvas id="sandboxCanvas" aria-label="GameSpec sandbox"></canvas>
    <pre id="sandboxOutput"></pre>
  </main>
  <script type="module" src="./src/sandbox/demo.js"></script>
</body>
</html>
