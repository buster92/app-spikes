<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060915">
  <title>Playloop GameSpec v1 draft</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #060915; color: #fff; font-family: system-ui, sans-serif; }
    main { width: min(100%, 430px); padding: 18px; }
    h1 { margin: 0 0 6px; font-size: 25px; }
    p { color: #aeb7d4; font-size: 13px; line-height: 1.45; }
    .badge { display: inline-block; margin: 5px 0 12px; padding: 5px 9px; border-radius: 999px; background: #1a1e31; color: #d5dcff; font-size: 11px; font-weight: 800; }
    .controls { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin: 0 0 10px; }
    select, button { min-height: 46px; border: 0; border-radius: 14px; font: inherit; font-weight: 800; }
    select { width: 100%; padding: 0 12px; background: #1a1e31; color: #fff; }
    button { padding: 0 16px; background: #fff; color: #111; }
    canvas { width: 100%; aspect-ratio: 360 / 560; display: block; border: 1px solid rgba(255,255,255,.1); border-radius: 22px; background: #0c1020; touch-action: none; }
    pre { min-height: 86px; white-space: pre-wrap; color: #9ca9d0; font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
  <main>
    <h1>GameSpec v1 draft</h1>
    <p>Two games, one sandbox. Pocket Shooter and Garden Catch share the same declarative runtime but use different art, rules and interaction loops. This is a visual-diversity pressure test, not a frozen public runtime.</p>
    <span class="badge">EXPERIMENTAL · creator content stays data</span>
    <div class="controls">
      <select id="v1Game" aria-label="Choose a GameSpec v1 example">
        <option value="shooter">Pocket Shooter</option>
        <option value="garden">Garden Catch</option>
      </select>
      <button id="restartV1" type="button">Restart</button>
    </div>
    <canvas id="v1Canvas" aria-label="GameSpec v1 demo"></canvas>
    <pre id="v1Output">Loading…</pre>
  </main>
  <script type="module" src="./src/sandbox/v1-demo.js"></script>
</body>
</html>
