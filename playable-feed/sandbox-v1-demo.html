<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060915">
  <title>Playloop GameSpec v1 draft</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #060915; color: #fff; font-family: system-ui, sans-serif; }
    main { width: min(100%, 430px); padding: 18px; }
    h1 { margin: 0 0 6px; font-size: 25px; }
    p { color: #aeb7d4; font-size: 13px; line-height: 1.45; }
    .badge { display: inline-block; margin: 5px 0 12px; padding: 5px 9px; border-radius: 999px; background: #1a1e31; color: #d5dcff; font-size: 11px; font-weight: 800; }
    button { width: 100%; min-height: 46px; margin: 0 0 10px; border: 0; border-radius: 14px; font: inherit; font-weight: 800; background: #fff; color: #111; }
    canvas { width: 100%; aspect-ratio: 360 / 560; display: block; border: 1px solid rgba(255,255,255,.1); border-radius: 22px; background: #0c1020; touch-action: none; }
    pre { min-height: 74px; white-space: pre-wrap; color: #9ca9d0; font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
  <main>
    <h1>GameSpec v1 draft</h1>
    <p>Pocket Shooter is still declarative data. v1 adds only bounded entity reads and entity-local scalar state, enough for bullets to spawn from the ship's current position and for the ship to carry health.</p>
    <span class="badge">EXPERIMENTAL · not a frozen public runtime</span>
    <button id="restartV1" type="button">Restart Pocket Shooter</button>
    <canvas id="v1Canvas" aria-label="Pocket Shooter v1"></canvas>
    <pre id="v1Output">Loading…</pre>
  </main>
  <script type="module" src="./src/sandbox/v1-demo.js"></script>
</body>
</html>
